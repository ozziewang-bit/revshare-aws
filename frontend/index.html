<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>RevShare SEA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap">
  <link rel="stylesheet" href="/style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#3b5bdb">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/icon-192.png">
</head>
<body>
  <div id="login-gate" hidden style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg,#fafaf9);z-index:1000;">
    <div style="text-align:center;max-width:340px;">
      <img src="/logo.png" alt="" style="height:40px;margin-bottom:18px;">
      <h2 style="margin:0 0 6px;">RevShare SEA</h2>
      <p class="muted" style="margin:0 0 20px;font-size:13px;">Sign in with your company Google account.</p>
      <div id="gsi-btn" style="display:flex;justify-content:center;"></div>
      <p id="login-err" style="color:#c23434;font-size:13px;margin-top:14px;"></p>
    </div>
  </div>
  <div class="shell" id="shell">
    <header class="topbar">
      <div class="brand"><img src="/logo.png" alt="ChargeSpot" class="brand-logo"><span class="brand-text">RevShare <span class="brand-region">SEA</span></span>
        <select id="region-switch" title="Region" style="margin-left:12px;padding:4px 8px;border:1px solid var(--border,#d4d4d8);border-radius:7px;font-size:13px;font-weight:600;background:#fff;cursor:pointer;">
          <option value="th">🇹🇭 Thailand</option>
          <option value="sg">🇸🇬 Singapore</option>
        </select>
      </div>
      <nav id="topnav"></nav>
    </header>
    <main id="main"></main>
  </div>

  <script src="/lib/html2canvas.min.js"></script>
  <script src="/lib/jspdf.umd.min.js"></script>
  <script src="/lib/xlsx.full.min.js"></script>
  <script src="/lib/zip.js"></script>
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/service-worker.js'));
    }
  </script>
</body>
</html>
